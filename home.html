<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body id="homeBody">
    <div id="begruessungHome">
      <h1>Hey Name<span>🧚🏼‍♀️</span></h1>
      <h3>Zeit, um Zähne zu putzen!</h3>
    </div>
    <div id="homeContainer">
      <div id="championContainer">
        <h2>Champion der Woche!</h2>
        <div id="championInfo">
          <span id="championEmoji">🏆</span>
          <div>
            <p id="championName">Mamma</p>
            <p id="championScore">980 ⭐ Zahnfee-Staub</p>
          </div>
        </div>
      </div>
      <div class="streakContainer">
        <h2>Dein Streak</h2>
        <h1>12🔥</h1>
        <h2>Tage in Folge</h2>
      </div>
      <div class="streakContainer">
        <div id="balkendiagrammContainer">
          <h2>Übersicht</h2>
          <canvas id="balkendiagramm"></canvas>
        </div>
        <div id="familienStreakInfo">
          <span id="familienStreakEmoji">🔥</span>
          <div>
            <p id="familienStreakName">Familienstreak</p>
            <p id="familienStreakScore">4 Tage in Folge</p>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <button class="footerIcon aktiv">
        <i class="ti ti-home"></i>
        Home
      </button>
      <button class="footerIcon">
        <i class="ti ti-chart-bar"></i>
        Stats
      </button>
      <button class="footerIcon">
        <i class="ti ti-users"></i>
        Familie
      </button>
      <button class="footerIcon">
        <i class="ti ti-settings"></i>
        Settings
      </button>
    </footer>
    <script></script>
  </body>
</html>
