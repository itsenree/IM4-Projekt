<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
  </head>
  <body id="homeBody">
    <!-- Header: greeting and quick message -->
    <div class="begruessung">
      <h1>Hey <span id="homeUsername">Name</span><span>🧚🏼‍♀️</span></h1>
      <h3>Zeit, um Zähne zu putzen!</h3>
    </div>
    <div id="homeContainer">
      <div id="championContainer">
        <h2>Aktueller Champion!</h2>
        <div id="championInfo">
          <span id="championEmoji">🏆</span>
          <div>
            <p id="championName"></p>
            <p id="championScore"><span></span> ⭐ Zahnfee-Staub</p>
          </div>
        </div>
      </div>
      <!-- Family overview chart -->
      <div class="streakContainer">
        <h2>Familien-Übersicht</h2>
        <canvas id="familienChart"></canvas>
      </div>
    </div>

    <footer>
      <button class="footerIcon aktiv">
        <a href="home.html">
          <i class="ti ti-home"></i>
          Home</a
        >
      </button>
      <button class="footerIcon">
        <a href="stats.html">
          <i class="ti ti-chart-bar"></i>
          Stats</a
        >
      </button>
      <button class="footerIcon">
        <a href="familie.html">
          <i class="ti ti-users"></i>
          Familie</a
        >
      </button>

      <button class="footerIcon">
        <a href="settings.html">
          <i class="ti ti-settings"></i>
          Konto</a
        >
      </button>
    </footer>
    <script src="../js/home.js"></script>
  </body>
</html>
