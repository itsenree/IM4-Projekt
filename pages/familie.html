<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body id="homeBody">
    <header>
    <div class="begruessung">
      <h1>Deine Familie</h1>
      <!-- WENN KEINE MITGLIEDER HINZUGEFÜGT -->
      <h3>Füge Mitglieder hinzu!</h3>
    </div>

    <div id="memberList">
      <!-- Members will be dynamically loaded here -->
    </div>

    <div id="addMemberSection">
      <button id="addBtn">Mitglied hinzufügen</button>

      <div id="memberForm" class="hidden">
        <input type="text" id="member_name" placeholder="Name">

        <select id="color">
          <option value="yellow">Yellow</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
          <option value="purple">Purple</option>
          <option value="pink">Pink</option>
        </select>

        <select id="brush_nr">
          <option value="0">Keine Position</option>
          <option value="1">Position 1</option>
          <option value="2">Position 2</option>
          <option value="3">Position 3</option>
        </select>

        <button id="confirmBtn">Hinzufügen</button>
      </div>
    </div>

    <footer>
      <button class="footerIcon">
        <a href="home.html">
          <i class="ti ti-home"></i>
          Home</a
        >
      </button>
      <button class="footerIcon">
        <a href="stats.html">
          <i class="ti ti-chart-bar"></i>
          Stats</a
        >
      </button>
      <button class="footerIcon aktiv">
        <a href="familie.html">
          <i class="ti ti-users"></i>
          Familie</a
        >
      </button>

      <button class="footerIcon">
        <a href="settings.html">
          <i class="ti ti-settings"></i>
          Einstellungen</a
        >
      </button>
    </footer>
    <script>

      const addBtn = document.getElementById("addBtn");
      const memberForm = document.getElementById("memberForm");

      addBtn.addEventListener("click", () => {
        memberForm.classList.toggle("hidden");
      });

      async function loadMembers() {
        try {
          const response = await fetch('../api/members_load.php');
          const result = await response.json();

          const memberList = document.getElementById('memberList');
          memberList.innerHTML = '';

          if (result.status === 'success' && result.data.length > 0) {
            result.data.forEach(member => {
              const memberDiv = document.createElement('div');
              memberDiv.classList.add('member-box'); // Add a class for styling

              const nameElement = document.createElement('p');
              nameElement.textContent = member.name;
              nameElement.classList.add('member-name'); // Add a class for styling

              memberDiv.appendChild(nameElement);
              memberList.appendChild(memberDiv);
            });
          } else {
            const noMembersMessage = document.createElement('p');
            noMembersMessage.textContent = 'No members found.';
            noMembersMessage.classList.add('no-members-message'); // Add a class for styling
            memberList.appendChild(noMembersMessage);
          }
        } catch (error) {
          console.error('Error loading members:', error);
        }
      }

      document.getElementById("confirmBtn").addEventListener("click", async () => {
        const name = document.getElementById("member_name").value;
        const brush_nr = document.getElementById("brush_nr").value;
        const color = document.getElementById("color").value;

        const data = { name, brush_nr, color };

        try {
          const response = await fetch("../api/members_save.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (result.status === "success") {
            alert("Member saved successfully!");
            loadMembers(); // Reload the members list
          } else {
            alert(`Error: ${result.message}`);
          }
        } catch (error) {
          console.error("Error saving member:", error);
          alert("An error occurred while saving the member.");
        }
      });

      // Load members on page load
      loadMembers();
    </script>
  </body>
</html>
