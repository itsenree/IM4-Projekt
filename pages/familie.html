<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <div class="begruessung">
        <h1>Deine Familie</h1>
        <!-- WENN KEINE MITGLIEDER HINZUGEFÜGT -->
        <h3>Füge Mitglieder hinzu!</h3>
      </div>
    </header>

    <div id="memberList">
      <!-- Members will be dynamically loaded here -->
    </div>

    <div id="memberSection">
      <button id="addBtn">Mitglied hinzufügen</button>

      <div id="memberForm" class="hidden">
        <div id="mitgliedParameter">
          <input type="text" id="member_name" placeholder="Name" />

          <select id="color">
            <option value="yellow">Gelb</option>
            <option value="red">Rot</option>
            <option value="green">Grün</option>
            <option value="blue">Blau</option>
            <option value="purple">Violett</option>
            <option value="pink">Pink</option>
          </select>

          <select id="brush_nr">
            <option value="0">Keine Position</option>
            <option value="1">Position 1</option>
            <option value="2">Position 2</option>
            <option value="3">Position 3</option>
          </select>
        </div>
        <button id="confirmBtn">Hinzufügen</button>
      </div>
    </div>

    <footer>
      <button class="footerIcon">
        <a href="home.html">
          <i class="ti ti-home"></i>
          Home</a
        >
      </button>
      <button class="footerIcon">
        <a href="stats.html">
          <i class="ti ti-chart-bar"></i>
          Stats</a
        >
      </button>
      <button class="footerIcon aktiv">
        <a href="familie.html">
          <i class="ti ti-users"></i>
          Familie</a
        >
      </button>

      <button class="footerIcon">
        <a href="settings.html">
          <i class="ti ti-settings"></i>
          Einstellungen</a
        >
      </button>
    </footer>
    <script>
      const addBtn = document.getElementById("addBtn");
      const memberForm = document.getElementById("memberForm");

      addBtn.addEventListener("click", () => {
        memberForm.classList.toggle("hidden");
      });

      async function loadMembers() {
        try {
          const response = await fetch("../api/members_load.php");
          const result = await response.json();

          const memberList = document.getElementById("memberList");
          memberList.innerHTML = "";

          if (result.status === "success" && result.data.length > 0) {
            result.data.forEach((member) => {
              const memberDiv = document.createElement("div");
              memberDiv.classList.add("member-box");

              const nameElement = document.createElement("p");
              nameElement.textContent = member.name;
              nameElement.classList.add("member-name");

              if (member.color) {
                memberDiv.classList.add(`member-color-${member.color}`);
              }

              const editBtn = document.createElement("button");
              editBtn.classList.add("edit-btn");
              editBtn.innerHTML = '<i class="ti ti-pencil"></i>';
              editBtn.addEventListener("click", () => editMember(member, memberDiv));

              const deleteBtn = document.createElement("button");
              deleteBtn.classList.add("delete-btn");
              deleteBtn.innerHTML = '<i class="ti ti-trash"></i>';
              deleteBtn.addEventListener("click", () => deleteMember(member.id));

              memberDiv.appendChild(nameElement);
              memberDiv.appendChild(editBtn);
              memberDiv.appendChild(deleteBtn);
              memberList.appendChild(memberDiv);
            });
          } else {
            const noMembersMessage = document.createElement("p");
            noMembersMessage.textContent = "No members found.";
            noMembersMessage.classList.add("no-members-message");
            memberList.appendChild(noMembersMessage);
          }
        } catch (error) {
          console.error("Error loading members:", error);
        }
      }

      function editMember(member, memberDiv) {
        // Clear the memberDiv and replace with editable fields
        memberDiv.innerHTML = "";

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = member.name;
        nameInput.classList.add("edit-name-input");

        const colorSelect = document.createElement("select");
        ["yellow", "red", "green", "blue", "purple", "pink"].forEach((color) => {
          const option = document.createElement("option");
          option.value = color;
          option.textContent = color.charAt(0).toUpperCase() + color.slice(1);
          if (member.color === color) option.selected = true;
          colorSelect.appendChild(option);
        });

        const brushSelect = document.createElement("select");
        ["0", "1", "2", "3"].forEach((brush) => {
          const option = document.createElement("option");
          option.value = brush;
          option.textContent = `Position ${brush}`;
          if (member.brush_nr === brush) option.selected = true;
          brushSelect.appendChild(option);
        });

        const saveBtn = document.createElement("button");
        saveBtn.textContent = "Save";
        saveBtn.classList.add("save-btn");
        saveBtn.addEventListener("click", async () => {
          const updatedMember = {
            member_id: member.id,
            name: nameInput.value,
            color: colorSelect.value,
            brush_nr: brushSelect.value,
          };

          try {
            const response = await fetch("../api/members_update.php", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(updatedMember),
            });

            const result = await response.json();

            if (result.success) {
              alert("Member updated successfully!");
              loadMembers();
            } else {
              alert(`Error: ${result.error}`);
            }
          } catch (error) {
            console.error("Error updating member:", error);
            alert("An error occurred while updating the member.");
          }
        });

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Cancel";
        cancelBtn.classList.add("cancel-btn");
        cancelBtn.addEventListener("click", () => loadMembers());

        memberDiv.appendChild(nameInput);
        memberDiv.appendChild(colorSelect);
        memberDiv.appendChild(brushSelect);
        memberDiv.appendChild(saveBtn);
        memberDiv.appendChild(cancelBtn);
      }

      async function deleteMember(id) {
        if (!confirm("Mitglied wirklich entfernen?")) return;

        try {
          const response = await fetch("../api/members_delete.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id }),
          });

          const result = await response.json();

          if (result.status === "success") {
            loadMembers();
          } else {
            alert(`Fehler: ${result.message}`);
          }
        } catch (error) {
          console.error("Error deleting member:", error);
          alert("Ein Fehler ist beim Löschen aufgetreten.");
        }
      }

      document
        .getElementById("confirmBtn")
        .addEventListener("click", async () => {
          const name = document.getElementById("member_name").value;
          const brush_nr = document.getElementById("brush_nr").value;
          const color = document.getElementById("color").value;

          const data = { name, brush_nr, color };

          try {
            const response = await fetch("../api/members_save.php", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            const result = await response.json();

            if (result.status === "success") {
              alert("Member saved successfully!");
              loadMembers();
            } else {
              alert(`Error: ${result.message}`);
            }
          } catch (error) {
            console.error("Error saving member:", error);
            alert("An error occurred while saving the member.");
          }
        });

      loadMembers();
    </script>
  </body>
</html>
