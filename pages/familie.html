<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body id="homeBody">
    <header>
    <div class="begruessung">
      <h1>Deine Familie</h1>
      <!-- WENN KEINE MITGLIEDER HINZUGEFÜGT -->
      <h3>Füge Mitglieder hinzu!</h3>
    </div>

    <div id="memberSection">

      <button id="addBtn">Mitglied hinzufügen</button>

      <div id="memberForm" class="hidden">
        <input type="text" id="member_name" placeholder="Name">

        <select id="color">
          <option value="yellow">Yellow</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
          <option value="purple">Purple</option>
          <option value="pink">Pink</option>
        </select>

        <select id="brush_nr">
          <option value="0">Keine Position</option>
          <option value="1">Position 1</option>
          <option value="2">Position 2</option>
          <option value="3">Position 3</option>
        </select>

        <button id="confirmBtn">Hinzufügen</button>
      </div>

    </div>

    <footer>
      <button class="footerIcon">
        <a href="home.html">
          <i class="ti ti-home"></i>
          Home</a
        >
      </button>
      <button class="footerIcon">
        <a href="stats.html">
          <i class="ti ti-chart-bar"></i>
          Stats</a
        >
      </button>
      <button class="footerIcon aktiv">
        <a href="familie.html">
          <i class="ti ti-users"></i>
          Familie</a
        >
      </button>

      <button class="footerIcon">
        <a href="settings.html">
          <i class="ti ti-settings"></i>
          Einstellungen</a
        >
      </button>
    </footer>
    <script>

      const addBtn = document.getElementById("addBtn");
      const memberForm = document.getElementById("memberForm");

      addBtn.addEventListener("click", () => {
        memberForm.classList.toggle("hidden");
      });

    </script>
  </body>
</html>
