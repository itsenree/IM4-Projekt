<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einstellungen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="settingsPage">
      <div class="begruessung">
        <h1>Einstellungen</h1>
        <h3>Verwalte dein Konto</h3>
      </div>

      <main id="settingsContainer">
        <section id="settingsCard" aria-labelledby="settingsTitle">
          <h2 id="settingsTitle">Kontodaten</h2>
          <p id="settingsMessage" class="settings-message" aria-live="polite"></p>
          <div id="settingsFields"></div>
        </section>
      </main>

      <div id="settingsLogoutContainer">
        <button id="logoutBtn" class="setting-button primary settings-logout-btn" type="button">
          Ausloggen
        </button>
      </div>
    </div>

    <footer>
      <button class="footerIcon">
        <a href="home.html">
          <i class="ti ti-home"></i>
          Home</a
        >
      </button>
      <button class="footerIcon">
        <a href="stats.html">
          <i class="ti ti-chart-bar"></i>
          Stats</a
        >
      </button>
      <button class="footerIcon">
        <a href="familie.html">
          <i class="ti ti-users"></i>
          Familie</a
        >
      </button>

      <button class="footerIcon aktiv">
        <a href="settings.html">
          <i class="ti ti-settings"></i>
          Konto</a
        >
      </button>
    </footer>
    <script src="../js/settings.js" defer></script>
  </body>
</html>
