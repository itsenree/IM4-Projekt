<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
  </head>
  <body>
    <div class="begruessung">
      <h1>Statistiken</h1>
      <div id="metrikenMitglieder">
        <div id="mitgliederButtons">
          <!-- Buttons werden dynamisch geladen -->
        </div>
      </div>
      <h3>Eine Übersicht von <span></span>s Metriken</h3>
    </div>
    <div id="statsContainer">
      <div class="streakContainer">
        <h2><span></span>s Streak</h2>
        <h1><span id="anzahlTageStreak"></span>🔥</h1>
        <h2>Tage in Folge</h2>
      </div>
      <div id="statsDiagramme">
        <section id="balkendiagrammContainer">
          <!-- Eingabefeld für die Zeitraumauswahl -->
          <input
            type="text"
            id="dateRange01"
            placeholder="Wähle deinen Zeitraum"
            style="text-align: center"
          />

          <!-- Canvas-Element für das Chart.js Diagramm -->
          <canvas id="balkenChart"></canvas>
        </section>
      </div>
    </div>

    <footer>
      <button class="footerIcon">
        <a href="home.html">
          <i class="ti ti-home"></i>
          Home</a
        >
      </button>
      <button class="footerIcon aktiv">
        <a href="stats.html">
          <i class="ti ti-chart-bar"></i>
          Stats</a
        >
      </button>
      <button class="footerIcon">
        <a href="familie.html">
          <i class="ti ti-users"></i>
          Familie</a
        >
      </button>

      <button class="footerIcon">
        <a href="settings.html">
          <i class="ti ti-settings"></i>
          Konto</a
        >
      </button>
    </footer>
    <script src="../js/stats.js"></script>
  </body>
</html>
